{{- if .Values.metrics.enabled }}
{{- $otlpEndpoint := include "curator-ray.otlp.endpoint" . }}
{{- $metricsOtlpEndpoint := default $otlpEndpoint .Values.metrics.otlp.endpoint }}
{{- $metricsOtlpEndpointOverride := .Values.metrics.otlp.endpoint }}
{{- if and .Values.otlp.endpoint (contains "${env:" (.Values.metrics.otlp.endpoint | toString)) }}
{{- $metricsOtlpEndpoint = $otlpEndpoint }}
{{- $metricsOtlpEndpointOverride = "" }}
{{- end }}
{{- $otlpCertPath := include "curator-ray.otlp.certPath" . }}
{{- $otlpKeyPath := include "curator-ray.otlp.keyPath" . }}
{{- $otlpCaPath := include "curator-ray.otlp.caPath" . }}
{{- $collectorExtractsNVCFSecrets := .Values.metrics.extractNVCFSecrets }}
{{- $metricsOtlpCertPath := default $otlpCertPath .Values.metrics.otlp.certPath }}
{{- $metricsOtlpKeyPath := default $otlpKeyPath .Values.metrics.otlp.keyPath }}
{{- $metricsOtlpCertsExplicit := or .Values.metrics.otlp.certPath .Values.metrics.otlp.keyPath }}
{{- $sharedOtlpCertsExplicit := and .Values.otlp.tls.certPath .Values.otlp.tls.keyPath }}
{{- $metricsOtlpUseCerts := or $collectorExtractsNVCFSecrets $metricsOtlpCertsExplicit $sharedOtlpCertsExplicit }}
{{- /* An extracted NVCF CA is never inferred; only an explicit otlp.tls.caPath sets ca_file. */ -}}
{{- $metricsOtlpUseCa := $otlpCaPath }}
{{- $replicas := .Values.replicas | int }}
{{- $svc := .Values.helmChartServiceName }}
{{- $targets := list }}
{{- range $i, $e := until $replicas }}
  {{- $targets = append $targets (printf "%s-%d.%s-headless:%d" $svc $i $svc ($.Values.metrics.port | int)) }}
{{- end }} 
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  relay: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            {{- $jobs := deepCopy (default (list) .Values.metrics.prometheus.scrapeConfigs) }}
            {{- if gt (len $jobs) 0 }}
            {{- $first := index $jobs 0 }}
            {{- if not (hasKey $first "static_configs") }}
            {{- $_ := set $first "static_configs" (list (dict "targets" $targets)) }}
            {{- end }}
            {{- end }}
            {{- toYaml $jobs | nindent 12 }}

    exporters:
      {{- if .Values.metrics.remoteWrite.enabled }}
      prometheus_remote_write:
        endpoint: {{ .Values.metrics.remoteWrite.endpoint | quote }}
        tls:
          cert_file: {{ .Values.metrics.remoteWrite.certPath | quote }}
          key_file: {{ .Values.metrics.remoteWrite.keyPath | quote }}
        external_labels:
          {{- $labels := deepCopy .Values.metrics.extraExternalLabels }}
          {{- $labels = merge $labels .Values.metrics.externalLabels }}
          {{- $labels = set $labels "namespace" "${env:POD_NS}" }}
          {{- toYaml $labels | nindent 10 }}
        write_buffer_size: 524288
        timeout: 30s
        max_batch_request_parallelism: 4 
        remote_write_queue:
          queue_size: 10000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      {{- end }}
      {{- if .Values.metrics.otlp.enabled }}
      otlp_http/metrics:
        {{- if $metricsOtlpEndpointOverride }}
        metrics_endpoint: {{ $metricsOtlpEndpoint | quote }}
        {{- else }}
        endpoint: {{ $metricsOtlpEndpoint | quote }}
        {{- end }}
        {{- if or $metricsOtlpUseCerts $metricsOtlpUseCa (include "curator-ray.metricsOtlp.insecureSkipVerify" . | eq "true") }}
        tls:
          {{- if and $metricsOtlpUseCerts $metricsOtlpCertPath }}
          cert_file: {{ $metricsOtlpCertPath | quote }}
          {{- end }}
          {{- if and $metricsOtlpUseCerts $metricsOtlpKeyPath }}
          key_file: {{ $metricsOtlpKeyPath | quote }}
          {{- end }}
          {{- if $metricsOtlpUseCa }}
          ca_file: {{ $otlpCaPath | quote }}
          {{- end }}
          insecure_skip_verify: {{ include "curator-ray.metricsOtlp.insecureSkipVerify" . }}
        {{- end }}
        timeout: 30s
        sending_queue:
          queue_size: 10000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      {{- end }}
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133          
    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      {{- if .Values.metrics.otlp.enabled }}
      attributes/external-labels:
        actions:
          {{- $labels := deepCopy .Values.metrics.extraExternalLabels }}
          {{- $labels = merge $labels .Values.metrics.externalLabels }}
          {{- $labels = set $labels "namespace" "${env:POD_NS}" }}
          {{- range $k, $v := $labels }}
          - key: {{ $k | quote }}
            value: {{ $v | quote }}
            action: upsert
          {{- end }}
      {{- end }}
    service:
      extensions:
      - health_check
      pipelines:
        {{- if .Values.metrics.remoteWrite.enabled }}
        metrics/remote-write:
          receivers: [prometheus]
          {{- if .Values.metrics.otlp.enabled }}
          processors: [memory_limiter, attributes/external-labels, batch]
          {{- else }}
          processors: [memory_limiter, batch]
          {{- end }}
          exporters: [prometheus_remote_write]
        {{- end }}
        {{- if .Values.metrics.otlp.enabled }}
        metrics/otlp:
          receivers: [prometheus]
          processors: [memory_limiter, attributes/external-labels, batch]
          exporters: [otlp_http/metrics]
        {{- end }}
      telemetry:
        logs:
          level: "info"
{{- end }}
