{{- $customEnv := default (dict) .Values.customEnvVars -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: curator-config
data:
  NVCF_MULTI_NODE: "true"
  NODES_PER_INSTANCE: {{ .Values.replicas | quote }}
  HEADLESS_SERVICE_NAME: {{ include "curator-ray.name" . }}-headless
  RAY_enable_open_telemetry: {{ .Values.rayMetrics.enableOpenTelemetry | quote }}
  {{- if .Values.rayAuth.enabled }}
  RAY_AUTH_MODE: "token"
  {{- end }}
  RAY_GCS_SERVER_PORT: {{ .Values.rayPorts.gcsServerPort | quote }}
  RAY_DASHBOARD_PORT: {{ .Values.rayPorts.dashboardPort | quote }}
  RAY_OBJECT_MANAGER_PORT: {{ .Values.rayPorts.objectManagerPort | quote }}
  RAY_NODE_MANAGER_PORT: {{ .Values.rayPorts.nodeManagerPort | quote }}
  AWS_CONFIG_FILE: {{ .Values.s3.credsPath }}
  NVCF_AWS_PROFILE_PATH: {{ .Values.s3.credsPath  }}
  REQUESTS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
  PYTHONPATH: {{ include "curator-ray.codeDir" . | quote }}
  PYTHON_LOG_FORMAT: {{ ternary "json" (.Values.logging.format | default "text") (and .Values.logging.otlp.enabled .Values.logging.otlp.forceJsonFormat) | quote }}
  {{- if not (hasKey $customEnv "TQDM_DISABLE") }}
  TQDM_DISABLE: "1"
  {{- end }}
  {{- if or .Values.logging.rayBackendJson (and .Values.logging.otlp.enabled .Values.logging.otlp.forceJsonFormat) }}
  RAY_BACKEND_LOG_JSON: "1"
  {{- end }}
  {{- if .Values.modelCacheDir }}
  NVCF_MODEL_CACHE_DIR: {{ .Values.modelCacheDir | quote }}
  {{- end }}
  {{- if .Values.triton.home }}
  TRITON_HOME: {{ .Values.triton.home | quote }}
  {{- end }}
{{ include "curator-ray.otlp.appEnv" . | nindent 2 }}
{{- with .Values.customEnvVars }}
{{- toYaml . | nindent 2 }}
{{- end }}
